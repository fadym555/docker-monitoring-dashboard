# Thresholds here match the colour bands on the Grafana dashboard (see README).
groups:
  - name: docker-monitoring
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is not reporting metrics"

      - alert: ContainerStopped
        expr: engine_daemon_container_states_containers{state="stopped"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} container(s) are stopped"

      - alert: ContainerHighCpu
        expr: sum by (name) (rate(container_cpu_usage_seconds_total{name!=""}[2m])) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} is using more than 80% of a CPU core"

      - alert: ContainerNearMemoryLimit
        expr: container_memory_working_set_bytes{name!=""} / (container_spec_memory_limit_bytes{name!=""} > 0) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} is above 90% of its memory limit"

      - alert: HostHighCpu
        expr: (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host CPU above 85% for 10 minutes

      - alert: HostDiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 > 85
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} is more than 85% full"
